name: Verificar

on:
  push:
    branches: [ main, avance-programacion-2 ]
  pull_request:

jobs:
  compilar-y-probar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
      # Compila, aplica el enhancement de JDO, corre pruebas unitarias y empaqueta.
      - name: mvn clean verify
        run: mvn -B clean verify
        env:
          SIGC_DB_PASSWORD: no-usada-en-pruebas-unitarias
