spring.application.name=SIGC
server.address=${SIGC_ADDRESS:127.0.0.1}
server.port=${SIGC_PORT:8080}
server.error.include-message=never
server.error.include-stacktrace=never
spring.thymeleaf.encoding=UTF-8
spring.web.locale=es_AR
spring.web.locale-resolver=fixed

# Base de datos: la clave SOLO se toma del entorno (no hay valor por defecto).
sigc.db.url=${SIGC_DB_URL:jdbc:mysql://localhost:3306/sigc?connectionTimeZone=America/Argentina/Buenos_Aires}
sigc.db.user=${SIGC_DB_USER:sigc}
sigc.db.password=${SIGC_DB_PASSWORD}

# Fotos de vehiculos: carpeta fuera del repositorio (configurable).
sigc.fotos.dir=${SIGC_FOTOS_DIR:./fotos}
spring.servlet.multipart.max-file-size=3MB
spring.servlet.multipart.max-request-size=4MB

logging.level.DataNucleus.Query=WARN
logging.level.DataNucleus.Datastore=WARN
