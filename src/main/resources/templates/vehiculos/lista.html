<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragmentos :: cabecera('Vehículos')}"></head>
<body>
<div class="app">
  <aside th:replace="~{fragmentos :: menu('vehiculos')}"></aside>
  <main class="contenido">
    <div class="encabezado">
      <div>
        <h1>Vehículos</h1>
        <p><span th:text="${#lists.size(vehiculos)}">0</span> resultado(s)</p>
      </div>
      <div class="d-flex gap-2">
        <a class="btn btn-sigc" th:href="@{/vehiculos/nuevo}">Registrar vehículo</a>
      </div>
    </div>

    <div th:replace="~{fragmentos :: mensajes}"></div>

    <form class="panel filtros mb-3" method="get" th:action="@{/vehiculos}">
      <div class="row g-2 align-items-end">
        <div class="col-md-4 col-lg-3">
          <label class="form-label" for="texto">Marca o modelo</label>
          <input class="form-control" id="texto" name="texto" th:value="${filtro.texto()}" placeholder="Ej: Toyota, Hilux">
        </div>
        <div class="col-6 col-md-2">
          <label class="form-label" for="tipo">Tipo</label>
          <select class="form-select" id="tipo" name="tipo">
            <option value="">Todos</option>
            <option th:each="t : ${tipos}" th:value="${t}" th:text="${t.etiqueta}" th:selected="${filtro.tipo() == t}"></option>
          </select>
        </div>
        <div class="col-6 col-md-2">
          <label class="form-label" for="estado">Estado</label>
          <select class="form-select" id="estado" name="estado">
            <option value="">Todos</option>
            <option th:each="e : ${estados}" th:value="${e}" th:text="${e.etiqueta}" th:selected="${filtro.estado() == e}"></option>
          </select>
        </div>
        <div class="col-6 col-md-2 col-lg-1">
          <label class="form-label" for="anioDesde">Año desde</label>
          <input class="form-control" type="number" id="anioDesde" name="anioDesde" th:value="${filtro.anioDesde()}">
        </div>
        <div class="col-6 col-md-2 col-lg-1">
          <label class="form-label" for="anioHasta">Año hasta</label>
          <input class="form-control" type="number" id="anioHasta" name="anioHasta" th:value="${filtro.anioHasta()}">
        </div>
        <div class="col-6 col-md-3 col-lg-2">
          <label class="form-label" for="precioMin">Precio mínimo</label>
          <input class="form-control" type="number" step="0.01" min="0" id="precioMin" name="precioMin" th:value="${filtro.precioMin()}">
        </div>
        <div class="col-6 col-md-3 col-lg-2">
          <label class="form-label" for="precioMax">Precio máximo</label>
          <input class="form-control" type="number" step="0.01" min="0" id="precioMax" name="precioMax" th:value="${filtro.precioMax()}">
        </div>
        <div class="col-6 col-md-3 col-lg-2">
          <label class="form-label" for="orden">Ordenar por</label>
          <select class="form-select" id="orden" name="orden">
            <option value="RECIENTES" th:selected="${filtro.orden() == null or filtro.orden() == 'RECIENTES'}">Más recientes</option>
            <option value="PRECIO_ASC" th:selected="${filtro.orden() == 'PRECIO_ASC'}">Precio: menor a mayor</option>
            <option value="PRECIO_DESC" th:selected="${filtro.orden() == 'PRECIO_DESC'}">Precio: mayor a menor</option>
          </select>
        </div>
        <div class="col-6 col-md-3 col-lg-2">
          <label class="form-label" for="vista">Vista</label>
          <select class="form-select" id="vista" name="vista">
            <option value="tarjetas" th:selected="${vista == 'tarjetas'}">Tarjetas</option>
            <option value="tabla" th:selected="${vista == 'tabla'}">Tabla</option>
          </select>
        </div>
        <div class="col-12 col-lg-auto d-flex align-items-center gap-3">
          <div class="form-check mb-0">
            <input class="form-check-input" type="checkbox" id="bajas" name="bajas" value="true" th:checked="${filtro.incluirBajas()}">
            <label class="form-check-label small" for="bajas">Incluir bajas</label>
          </div>
          <button class="btn btn-sigc" type="submit">Filtrar</button>
          <a class="btn btn-outline-sigc" th:href="@{/vehiculos}">Limpiar</a>
        </div>
      </div>
    </form>

    <div class="panel text-center text-secondary" th:if="${#lists.isEmpty(vehiculos)}">
      No hay vehículos que coincidan con la búsqueda.
      <a th:href="@{/vehiculos/nuevo}">Registrar el primero</a>.
    </div>

    <!-- Vista de tarjetas -->
    <div class="row g-3" th:if="${vista == 'tarjetas' and !#lists.isEmpty(vehiculos)}">
      <div class="col-sm-6 col-xl-4 col-xxl-3" th:each="v : ${vehiculos}">
        <article class="auto-tarjeta" th:classappend="${!v.activo} ? 'inactivo'">
          <a class="auto-foto text-decoration-none" th:href="@{/vehiculos/{id}(id=${v.id})}">
            <img th:if="${v.foto != null}" th:src="@{/fotos/{n}(n=${v.foto})}" th:alt="${v.titulo}">
            <th:block th:if="${v.foto == null}"><div th:replace="~{fragmentos :: sinFoto(${v.tipo})}"></div></th:block>
            <span class="estado" th:classappend="${v.activo} ? ('estado-' + ${v.estado}) : 'estado-BAJA'"
                  th:text="${v.activo} ? ${v.estado.etiqueta} : 'De baja'"></span>
            <span class="tipo" th:text="${v.tipo}">Auto</span>
          </a>
          <div class="auto-cuerpo">
            <h3 th:text="${v.titulo}">Marca Modelo</h3>
            <div class="meta">
              <span th:text="${v.anio}">2020</span> ·
              <span th:text="${#numbers.formatInteger(v.kilometraje, 1, 'POINT')} + ' km'">0 km</span> ·
              <span th:text="${v.combustible.etiqueta}">Nafta</span>
            </div>
            <div class="meta" th:text="${v.detalleEspecifico}">Detalle</div>
            <div class="auto-precio" th:text="'$ ' + ${#numbers.formatDecimal(v.precio, 1, 'POINT', 2, 'COMMA')}">$ 0,00</div>
            <div class="auto-acciones">
              <a class="btn btn-sm btn-outline-sigc" th:href="@{/vehiculos/{id}(id=${v.id})}">Ver ficha</a>
              <a class="btn btn-sm btn-outline-sigc" th:if="${v.activo and v.estado.name() != 'VENDIDO'}" th:href="@{/vehiculos/{id}/editar(id=${v.id})}">Editar</a>
            </div>
          </div>
        </article>
      </div>
    </div>

    <!-- Vista de tabla -->
    <div class="panel p-0 table-responsive" th:if="${vista == 'tabla' and !#lists.isEmpty(vehiculos)}">
      <table class="table table-hover tabla-sigc">
        <thead>
          <tr><th></th><th>Vehículo</th><th>Tipo</th><th>Año</th><th>Km</th><th>Precio</th><th>Estado</th><th></th></tr>
        </thead>
        <tbody>
          <tr th:each="v : ${vehiculos}" th:classappend="${!v.activo} ? 'inactivo'">
            <td>
              <img class="miniatura" th:if="${v.foto != null}" th:src="@{/fotos/{n}(n=${v.foto})}" alt="">
              <span class="miniatura" th:if="${v.foto == null}"></span>
            </td>
            <td><a class="fw-semibold text-decoration-none" th:href="@{/vehiculos/{id}(id=${v.id})}" th:text="${v.titulo}">Marca Modelo</a><div class="small text-secondary" th:text="${v.detalleEspecifico}"></div></td>
            <td th:text="${v.tipo}">Auto</td>
            <td th:text="${v.anio}">2020</td>
            <td th:text="${#numbers.formatInteger(v.kilometraje, 1, 'POINT')}">0</td>
            <td class="fw-semibold" th:text="'$ ' + ${#numbers.formatDecimal(v.precio, 1, 'POINT', 2, 'COMMA')}">$ 0,00</td>
            <td><span class="estado" th:classappend="${v.activo} ? ('estado-' + ${v.estado}) : 'estado-BAJA'" th:text="${v.activo} ? ${v.estado.etiqueta} : 'De baja'"></span></td>
            <td class="text-end text-nowrap">
              <a class="btn btn-sm btn-outline-sigc" th:href="@{/vehiculos/{id}(id=${v.id})}">Ficha</a>
              <a class="btn btn-sm btn-outline-sigc" th:if="${v.activo and v.estado.name() != 'VENDIDO'}" th:href="@{/vehiculos/{id}/editar(id=${v.id})}">Editar</a>
            </td>
          </tr>
        </tbody>
      </table>
    </div>
  </main>
</div>
</body>
</html>
