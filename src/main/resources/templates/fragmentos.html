<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head th:fragment="cabecera(titulo)">
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title th:text="${titulo} + ' · SIGC'">SIGC</title>
  <link rel="stylesheet" th:href="@{/webjars/bootstrap/5.3.8/css/bootstrap.min.css}">
  <link rel="stylesheet" th:href="@{/css/sigc.css}">
</head>
<body>
<aside class="lateral" th:fragment="menu(activo)">
  <a class="marca" th:href="@{/}">
    <span class="marca-logo">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 14l2-5a2 2 0 0 1 1.9-1.4h10.2A2 2 0 0 1 19 9l2 5v4h-2.5M3 14v4h2.5M3 14h18"/><circle cx="7.5" cy="17.5" r="2"/><circle cx="16.5" cy="17.5" r="2"/></svg>
    </span>
    <span class="marca-texto"><strong>SIGC</strong><small>Gestión de concesionaria</small></span>
  </a>
  <nav aria-label="Navegación principal">
    <a th:href="@{/}" th:classappend="${activo == 'inicio'} ? 'activo'">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 14l4-4"/><path d="M3.3 17a9 9 0 1 1 17.4 0"/><circle cx="12" cy="14" r="1"/></svg>
      Dashboard
    </a>
    <a th:href="@{/vehiculos}" th:classappend="${activo == 'vehiculos'} ? 'activo'">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 14l2-5a2 2 0 0 1 1.9-1.4h10.2A2 2 0 0 1 19 9l2 5v4H3z"/><circle cx="7.5" cy="17.5" r="1.5"/><circle cx="16.5" cy="17.5" r="1.5"/></svg>
      Vehículos
    </a>
    <a th:href="@{/inventario}" th:classappend="${activo == 'inventario'} ? 'activo'">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="6" rx="1"/><rect x="3" y="14" width="18" height="6" rx="1"/></svg>
      Inventario
    </a>
    <a th:href="@{/clientes}" th:classappend="${activo == 'clientes'} ? 'activo'">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="9" cy="8" r="3.5"/><path d="M2.5 20a6.5 6.5 0 0 1 13 0"/><path d="M16 4.5a3.5 3.5 0 0 1 0 7M18 14a6.5 6.5 0 0 1 3.5 6"/></svg>
      Clientes
    </a>
    <a th:href="@{/vendedores}" th:classappend="${activo == 'vendedores'} ? 'activo'">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="7" width="18" height="13" rx="2"/><path d="M9 7V5a3 3 0 0 1 6 0v2M3 13h18"/></svg>
      Vendedores
    </a>
    <a th:href="@{/ventas}" th:classappend="${activo == 'ventas'} ? 'activo'">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 3h12v18l-3-2-3 2-3-2-3 2z"/><path d="M9 8h6M9 12h6"/></svg>
      Ventas
    </a>
    <a th:href="@{/testdrives}" th:classappend="${activo == 'testdrives'} ? 'activo'">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg>
      Test drives
    </a>
    <a th:href="@{/reportes}" th:classappend="${activo == 'reportes'} ? 'activo'">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 20V10M10 20V4M16 20v-7M22 20H2"/></svg>
      Reportes
    </a>
  </nav>
  <div class="pie">SIGC · Programación 2 · IFES</div>
</aside>

<!-- Icono de vehiculo sin foto, segun el tipo (Auto, Moto o Camion). -->
<div th:fragment="sinFoto(tipo)" class="sin-foto">
  <svg th:if="${tipo == 'Moto'}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><circle cx="5.5" cy="16.5" r="3"/><circle cx="18.5" cy="16.5" r="3"/><path d="M5.5 16.5L9 9h4l3 7.5M13 9l-1-3h-2M9 9H6"/></svg>
  <svg th:if="${tipo == 'Camion'}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M2 6h11v10H2zM13 9h4l3 3v4h-7z"/><circle cx="6.5" cy="17.5" r="1.8"/><circle cx="16.5" cy="17.5" r="1.8"/></svg>
  <svg th:if="${tipo != 'Moto' and tipo != 'Camion'}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M3 14l2-5a2 2 0 0 1 1.9-1.4h10.2A2 2 0 0 1 19 9l2 5v4H3z"/><circle cx="7.5" cy="17.5" r="1.5"/><circle cx="16.5" cy="17.5" r="1.5"/></svg>
  Sin foto
</div>

<!-- Mensajes de exito o error (flash o del modelo). -->
<div th:fragment="mensajes">
  <div class="alert alert-success" role="alert" th:if="${mensaje}" th:text="${mensaje}"></div>
  <div class="alert alert-danger" role="alert" th:if="${error}" th:text="${error}"></div>
</div>
<!-- Fragmento: barras horizontales con CSS (sin librerias externas). -->
<div th:fragment="barras(filas)">
  <p class="text-secondary mb-0" th:if="${filas.isEmpty()}">Sin ventas en este período.</p>
  <div class="barra-bloque" th:each="f : ${filas}">
    <div class="d-flex justify-content-between small">
      <span th:text="${f.etiqueta()}"></span>
      <span><strong th:text="${f.cantidad()}"></strong> · <span th:text="'$ ' + ${#numbers.formatDecimal(f.monto(), 1, 'POINT', 2, 'COMMA')}"></span></span>
    </div>
    <div class="barra-pista"><div class="barra-relleno" th:style="'width:' + ${f.ancho()} + '%'"></div></div>
  </div>
</div>
</body>
</html>
