<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragmentos :: cabecera('Comprobante ' + ${venta.numeroComprobante})}"></head>
<body>
<div class="app">
  <aside th:replace="~{fragmentos :: menu('ventas')}"></aside>
  <main class="contenido">
    <div class="encabezado no-imprimir">
      <div><h1>Comprobante de venta</h1></div>
      <div class="d-flex gap-2">
        <a class="btn btn-outline-sigc" th:href="@{/ventas}">Volver a ventas</a>
        <button class="btn btn-sigc" type="button" onclick="window.print()">Imprimir</button>
      </div>
    </div>
    <div class="no-imprimir" th:replace="~{fragmentos :: mensajes}"></div>

    <div class="panel" style="max-width:760px">
      <div class="d-flex justify-content-between align-items-start mb-3">
        <div><div class="fw-bold fs-4">SIGC · Concesionaria</div><div class="text-secondary">Comprobante interno, sin validez fiscal</div></div>
        <div class="text-end"><div class="fw-bold fs-5" th:text="${venta.numeroComprobante}">V-000001</div>
          <div th:text="${#temporals.format(venta.fechaHora, 'dd/MM/yyyy HH:mm')}"></div></div>
      </div>
      <h2>Cliente</h2>
      <div class="dato"><span>Nombre</span><span th:text="${venta.cliente.nombreCompleto}"></span></div>
      <div class="dato"><span>DNI</span><span th:text="${venta.cliente.dni}"></span></div>
      <h2 class="mt-3">Vehículo</h2>
      <div class="dato"><span>Descripción</span><span th:text="${venta.vehiculo.titulo}"></span></div>
      <div class="dato"><span>Año / km</span><span th:text="${venta.vehiculo.anio} + ' · ' + ${#numbers.formatInteger(venta.vehiculo.kilometraje, 1, 'POINT')} + ' km'"></span></div>
      <div class="dato"><span>Características</span><span th:text="${venta.vehiculo.detalleEspecifico}"></span></div>
      <div class="dato"><span>Código interno</span><span th:text="'V' + ${#numbers.formatInteger(venta.vehiculo.id, 5)}"></span></div>
      <h2 class="mt-3">Operación</h2>
      <div class="dato"><span>Vendedor</span><span th:text="${venta.vendedor.nombreCompleto} + ' (legajo ' + ${venta.vendedor.legajo} + ')'"></span></div>
      <div class="dato"><span>Modalidad de pago</span><span th:text="${venta.modalidadPago.etiqueta}"></span></div>
      <div class="dato"><span>Precio de lista</span><span th:text="'$ ' + ${#numbers.formatDecimal(venta.vehiculo.precio, 1, 'POINT', 2, 'COMMA')}"></span></div>
      <div class="dato fw-bold fs-5"><span>Total acordado</span><span th:text="'$ ' + ${#numbers.formatDecimal(venta.precioVenta, 1, 'POINT', 2, 'COMMA')}"></span></div>
    </div>
  </main>
</div>
</body>
</html>
