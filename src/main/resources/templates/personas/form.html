<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragmentos :: cabecera(${existente != null ? 'Editar ' + singular : 'Nuevo ' + singular})}"></head>
<body>
<div class="app">
  <aside th:replace="~{fragmentos :: menu(${modulo})}"></aside>
  <main class="contenido">
    <div class="encabezado">
      <div>
        <h1 th:text="${existente != null ? 'Editar ' + singular : 'Registrar ' + singular}">Registrar</h1>
        <p>Los campos con * son obligatorios.</p>
      </div>
    </div>
    <div th:replace="~{fragmentos :: mensajes}"></div>
    <div class="alert alert-danger" role="alert" th:if="${#fields.hasErrors('${datos.*}')}">Revise los campos marcados en rojo.</div>

    <form class="panel" method="post" th:object="${datos}"
          th:action="${existente != null} ? @{/{m}/{id}(m=${modulo},id=${existente.id})} : @{/{m}(m=${modulo})}">
      <div class="row g-3">
        <div class="col-md-6">
          <label class="form-label" for="nombre">Nombre *</label>
          <input class="form-control" id="nombre" th:field="*{nombre}" th:errorclass="is-invalid" maxlength="80">
          <div class="invalid-feedback" th:errors="*{nombre}"></div>
        </div>
        <div class="col-md-6">
          <label class="form-label" for="apellido">Apellido *</label>
          <input class="form-control" id="apellido" th:field="*{apellido}" th:errorclass="is-invalid" maxlength="80">
          <div class="invalid-feedback" th:errors="*{apellido}"></div>
        </div>
        <div class="col-md-4">
          <label class="form-label" for="dni">DNI * (7 u 8 dígitos)</label>
          <input class="form-control" id="dni" th:field="*{dni}" th:errorclass="is-invalid" maxlength="12" inputmode="numeric">
          <div class="invalid-feedback" th:errors="*{dni}"></div>
        </div>
        <div class="col-md-4" th:if="${esVendedor}">
          <label class="form-label" for="legajo">Legajo *</label>
          <input class="form-control" id="legajo" th:field="*{legajo}" th:errorclass="is-invalid" maxlength="20">
          <div class="invalid-feedback" th:errors="*{legajo}"></div>
        </div>
        <div class="col-md-4">
          <label class="form-label" for="telefono">Teléfono</label>
          <input class="form-control" id="telefono" th:field="*{telefono}" th:errorclass="is-invalid" maxlength="32">
          <div class="invalid-feedback" th:errors="*{telefono}"></div>
        </div>
        <div class="col-md-6">
          <label class="form-label" for="email">Correo electrónico</label>
          <input class="form-control" type="email" id="email" th:field="*{email}" th:errorclass="is-invalid" maxlength="120">
          <div class="invalid-feedback" th:errors="*{email}"></div>
        </div>
      </div>
      <div class="d-flex gap-2 mt-4">
        <button class="btn btn-sigc" type="submit" th:text="${existente != null} ? 'Guardar cambios' : 'Registrar'">Guardar</button>
        <a class="btn btn-outline-sigc" th:href="${existente != null} ? @{/{m}/{id}(m=${modulo},id=${existente.id})} : @{/{m}(m=${modulo})}">Cancelar</a>
      </div>
    </form>
  </main>
</div>
</body>
</html>
